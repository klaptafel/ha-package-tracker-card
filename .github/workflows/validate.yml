name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-js:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check package-tracker-card.js
      - name: Translation completeness report
        run: node scripts/check-translations.js
      - name: translate_events tests
        run: node scripts/test-translate-events.js
